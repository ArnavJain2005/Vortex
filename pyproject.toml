[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex"
version = "0.1.0"
description = "Trajectory estimation under sensor degradation (Samsung PRISM XR Hackathon 2026, Track 3)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vortex = "vortex.cli:main"

[tool.setuptools.packages.find]
include = ["vortex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
