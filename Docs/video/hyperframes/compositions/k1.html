<template>
<style>

#root{position:absolute;inset:0;overflow:hidden;font-family:Inter,sans-serif;color:#f3f5ff;}
#root .world{position:absolute;inset:0;transform-origin:50% 45%;}
#root .mono{font-family:'JetBrains Mono',monospace;}

  box-shadow:0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);}
#root .label{font-weight:700;letter-spacing:.01em;}

#root .schem{position:absolute;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.12em;

  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);background-size:300% 100%;}


#k1-dots{position:absolute;left:0;top:0;}
#k1-word{position:absolute;left:0;width:1920px;top:120px;text-align:center;font-weight:900;font-size:168px;letter-spacing:.16em;
  padding-left:.16em;color:#f3f5ff;text-shadow:0 0 30px rgba(94,200,242,.45);}
#k1-sub{position:absolute;left:0;width:1920px;top:322px;text-align:center;font-size:30px;font-weight:700;letter-spacing:.22em;color:#5ec8f2;}
#k1-sweep{position:absolute;left:560px;top:120px;width:800px;height:200px;}

</style>
<div id="root" data-composition-id="k1" data-width="1920" data-height="1080" data-duration="5.110" >
<div class="world" id="k1-world">
<canvas id="k1-dots" width="1920" height="1080"></canvas>
<div id="k1-word">VORTEX</div><div class="sweep" id="k1-sweep"></div>
<div id="k1-sub">TRACK 3 · PATH FINDER</div></div>
</div>
<script>
(function(){
gsap.registerPlugin(DrawSVGPlugin, MorphSVGPlugin, MotionPathPlugin);

const P={bg:'#0a0e2e',panel:'#121a45',text:'#f3f5ff',cyan:'#5ec8f2',mint:'#7ee0b5',violet:'#c38bf5',amber:'#f5a35e',red:'#ff6b6b'};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function typeOn(tl,sel,text,at,dur){const el=document.querySelector(sel);const o={n:0};el.textContent='';
  tl.fromTo(o,{n:0},{n:text.length,duration:dur,ease:'none',onUpdate:()=>{el.textContent=text.slice(0,Math.round(o.n));}},at);}
function countUp(tl,sel,to,dec,at,dur,suffix){const el=document.querySelector(sel);const o={v:0};
  tl.fromTo(o,{v:0},{v:to,duration:dur,ease:'power3.out',onUpdate:()=>{el.textContent=o.v.toFixed(dec)+(suffix||'');}},at);}
function inBlur(tl,sel,at,d){tl.fromTo(sel,{opacity:0,filter:'blur(8px)'},{opacity:1,filter:'blur(0px)',duration:d||0.35,ease:'power3.out'},at);}
function outBlur(tl,sel,at,d){tl.to(sel,{opacity:0,filter:'blur(8px)',duration:d||0.22,ease:'power2.in'},at);}
function popIn(tl,sel,at,d){tl.fromTo(sel,{opacity:0,scale:0.86},{opacity:1,scale:1,duration:d||0.45,ease:'expo.out'},at);}
function sweep(tl,sel,at){tl.fromTo(sel,{backgroundPosition:'120% 0'},{backgroundPosition:'-20% 0',duration:0.9,ease:'power2.inOut'},at);
  tl.fromTo(sel,{opacity:0},{opacity:1,duration:0.15},at);tl.to(sel,{opacity:0,duration:0.2},at+0.75);}

const tl = gsap.timeline({paused:true});
const D=5.110;
// slow, never-stopping drift of the whole scene (B-roll feel)
tl.fromTo('#k1-world',{scale:1.0},{scale:1.03,duration:D,ease:'none'},0);

const cv=document.getElementById('k1-dots'), cx=cv.getContext('2d');
// sample the wordmark's own shape so the IMU sample dots land on the letters
const off=document.createElement('canvas'); off.width=1920; off.height=1080; const o=off.getContext('2d');
o.font='900 168px Inter'; o.textAlign='center'; o.textBaseline='alphabetic'; o.fillStyle='#fff';
o.letterSpacing='27px'; o.fillText('VORTEX',973,282);
const img=o.getImageData(0,0,1920,1080).data; const T=[]; const r=rng(5);
for(let y=100;y<300;y+=6) for(let x=400;x<1520;x+=6){ if(img[(y*1920+x)*4+3]>128) T.push([x,y]); }
const N=T.length, S=[];
for(let i=0;i<N;i++){ const a=r()*6.283, d=500+r()*700; S.push([960+Math.cos(a)*d, 300+Math.sin(a)*d*0.6, r()*0.5, r()]); }
const k={p:0, s:0}; const A=0.7, B=3.54;
function draw(){ cx.clearRect(0,0,1920,1080);
  for(let i=0;i<N;i++){ const s=S[i], t=T[i];
    let q=Math.min(1,Math.max(0,(k.p - s[2]*0.45)/0.55)); q=1-Math.pow(1-q,3);
    const x=s[0]+(t[0]-s[0])*q, y=s[1]+(t[1]-s[1])*q + Math.sin((1-q)*6+s[3]*6)*18*(1-q);
    const sc=k.s; const xx=x+(s[0]-x)*sc*0.0, yy=y - sc*260;
    cx.globalAlpha=(0.35+0.65*q)*(1-k.s); cx.fillStyle=q>0.98?'#f3f5ff':'#5ec8f2';
    cx.beginPath(); cx.arc(xx,yy,2.2,0,6.283); cx.fill(); } }
tl.fromTo(k,{p:0},{p:1,duration:B-A,ease:'none',onUpdate:draw},A);
tl.fromTo('#k1-word',{opacity:0,filter:'blur(6px)'},{opacity:1,filter:'blur(0px)',duration:0.35,ease:'power2.out'},B-0.12);
tl.to('#k1-dots',{opacity:0,duration:0.3},B+0.05);
sweep(tl,'#k1-sweep',B+0.25);
tl.fromTo('#k1-sub',{opacity:0,scaleX:1.25,filter:'blur(6px)'},{opacity:1,scaleX:1,filter:'blur(0px)',duration:0.8,ease:'expo.out'},2.02);
// hand-off: title lifts away as the circle glides to the corner
tl.to(['#k1-word','#k1-sub'],{y:-60,opacity:0,filter:'blur(8px)',duration:0.5,ease:'power3.in'},4.56);
draw();

window.__timelines["k1"] = tl;
})();
</script>
</template>
