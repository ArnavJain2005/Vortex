<script>
(function(){
gsap.registerPlugin(DrawSVGPlugin, MorphSVGPlugin, MotionPathPlugin);

const P={bg:'#0a0e2e',panel:'#121a45',text:'#f3f5ff',cyan:'#5ec8f2',mint:'#7ee0b5',violet:'#c38bf5',amber:'#f5a35e',red:'#ff6b6b'};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function typeOn(tl,sel,text,at,dur){const el=document.querySelector(sel);const o={n:0};el.textContent='';
  tl.fromTo(o,{n:0},{n:text.length,duration:dur,ease:'none',onUpdate:()=>{el.textContent=text.slice(0,Math.round(o.n));}},at);}
function countUp(tl,sel,to,dec,at,dur,suffix){const el=document.querySelector(sel);const o={v:0};
  tl.fromTo(o,{v:0},{v:to,duration:dur,ease:'power3.out',onUpdate:()=>{el.textContent=o.v.toFixed(dec)+(suffix||'');}},at);}
function inBlur(tl,sel,at,d){tl.fromTo(sel,{opacity:0,filter:'blur(8px)'},{opacity:1,filter:'blur(0px)',duration:d||0.35,ease:'power3.out'},at);}
function outBlur(tl,sel,at,d){tl.to(sel,{opacity:0,filter:'blur(8px)',duration:d||0.22,ease:'power2.in'},at);}
function popIn(tl,sel,at,d){tl.fromTo(sel,{opacity:0,scale:0.86},{opacity:1,scale:1,duration:d||0.45,ease:'expo.out'},at);}
function sweep(tl,sel,at){tl.fromTo(sel,{backgroundPosition:'120% 0'},{backgroundPosition:'-20% 0',duration:0.9,ease:'power2.inOut'},at);
  tl.fromTo(sel,{opacity:0},{opacity:1,duration:0.15},at);tl.to(sel,{opacity:0,duration:0.2},at+0.75);}

const tl = gsap.timeline({paused:true});
const D=15.710;
// slow, never-stopping drift of the whole scene (B-roll feel)
tl.fromTo('#k3-world',{scale:1.0},{scale:1.03,duration:D,ease:'none'},0);

const path=MotionPathPlugin.getRawPath('#k3-path'); MotionPathPlugin.cacheRawPathMeasurements(path);
const M=26, pos=[];
for(let i=0;i<M;i++){ const p=MotionPathPlugin.getPositionOnPath(path, 0.03+i*0.94/(M-1), true); pos.push(p);
  const el=document.getElementById('k3-m'+i); el.style.left=p.x+'px'; el.style.top=p.y+'px';
  el.querySelector('.k3-arr').style.transform='rotate('+(p.angle-25+Math.sin(i*1.7)*35).toFixed(1)+'deg)'; }
const nog=document.getElementById('k3-nog'); nog.style.left=(pos[10].x-50)+'px'; nog.style.top=(pos[10].y+34)+'px';
[0,1,2].forEach(k=>{ const p=pos[[3,6,15][k]]; const g=document.getElementById('k3-g'+k); g.style.left=p.x+'px'; g.style.top=p.y+'px'; });
gsap.set('.k3-m',{opacity:0,scale:0.4}); gsap.set('.k3-giz',{opacity:0});
// enter: the K-2 card lands here as the input card; node and tag build
tl.fromTo('#k3-in',{opacity:0},{opacity:1,duration:0.2},0.54+0.42);
tl.fromTo('.k3-row',{scaleX:0,transformOrigin:'0 50%'},{scaleX:1,duration:0.4,ease:'expo.out',stagger:0.04},0.54+0.5);
popIn(tl,'#k3-node',0.54-0.1,0.6);
tl.fromTo('#k3-tag',{opacity:0,y:10},{opacity:1,y:0,duration:0.5,ease:'expo.out'},2.06-0.1);
// rows stream from the card into the node (data dust)
for(let i=0;i<14;i++){ const d=document.createElement('div'); d.className='k3-fly'; d.id='k3-f'+i;
  d.style.cssText='position:absolute;left:560px;top:'+(270+(i%7)*26)+'px;width:26px;height:6px;border-radius:3px;background:#5ec8f2;box-shadow:0 0 10px #5ec8f2;opacity:0';
  document.getElementById('k3-world').appendChild(d);
  const t=0.54+0.3+i*0.22; tl.fromTo(d,{x:0,y:0,opacity:0},{keyframes:[{opacity:1,duration:0.08},{x:190,y:(365-(270+(i%7)*26))*1.0,duration:0.42,ease:'power2.in'},{opacity:0,duration:0.06}]},t); }
tl.to('#k3-path',{attr:{'stroke-dasharray':'2 10'},duration:0.1},3.66);
tl.fromTo('#k3-path',{drawSVG:'0%'},{drawSVG:'100%',duration:1.6,ease:'power2.inOut'},3.66-0.2);
// one pose marker per row, in order (rows 9-12 never arrive -> no marker)
for(let i=0;i<22;i++){ if(i>=9&&i<=12) continue; tl.to('#k3-m'+i,{opacity:1,scale:1,duration:0.35,ease:'expo.out'},3.66+0.1+i*0.07); }
// approved 3D #1: three markers open into x/y/z gizmos, turn, then flatten back into the path
[0,1,2].forEach(k=>{ const g='#k3-g'+k, z='#k3-gz'+k;
  tl.fromTo(g,{opacity:0,scale:0.3},{opacity:1,scale:1,duration:0.45,ease:'expo.out'},5.74+k*0.12);
  tl.fromTo(z,{rotationX:-20,rotationY:30,rotationZ:0},{rotationX:-55,rotationY:160+k*40,rotationZ:25,duration:1.7,ease:'power2.inOut'},5.74+k*0.12);
  tl.to(z,{rotationX:0,rotationY:0,rotationZ:0,scale:0.4,duration:0.5,ease:'power3.in'},5.74+1.9);
  tl.to(g,{opacity:0,duration:0.25},5.74+2.25); });
// output line, typed
inBlur(tl,'#k3-outc',6.94+0.6,0.4);
typeOn(tl,'#k3-out','timestamp tx ty tz qx qy qz qw',6.94-0.3,0.9);
// missing rows: gaps in the input, no marker for them
tl.to(['#k3-r4','#k3-r5','#k3-r6'],{opacity:0.08,duration:0.3},9.26);
tl.fromTo('#k3-nog',{opacity:0},{opacity:1,duration:0.4},9.26+0.25);
// blind rows: grey-amber rows -> faded dashed markers with an uncertainty halo
tl.to(['#k3-r8','#k3-r9','#k3-r10'],{backgroundColor:'rgba(245,163,94,.28)',duration:0.4},12.3);

tl.fromTo('.k3-m.blind .k3-dot',{scale:0.6},{scale:1.25,duration:0.8,ease:'sine.inOut'},14.22);
tl.fromTo('#k3-sch',{opacity:0},{opacity:1,duration:0.5},3.66+0.4);

tl.to(['#k3-in','#k3-tag','.k3-m','#k3-path','#k3-out','#k3-outc','#k3-nog','#k3-sch'],{opacity:0,filter:'blur(10px)',duration:0.45,ease:'power2.in'},14.81);
